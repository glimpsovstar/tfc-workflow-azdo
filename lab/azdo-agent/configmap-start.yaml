# Azure Pipelines agent start script for the lab agent pod.
#
# Source: Microsoft, "Run a self-hosted agent in Docker", Linux start.sh
#   https://learn.microsoft.com/azure/devops/pipelines/agents/docker
#   Page ms.date 2026-08-14, updated 2026-09-04. Checked on 2026-11-15.
#
# Adapted from Microsoft's script:
#   - PAT only. The service principal path (AZP_CLIENTID, az login) is removed
#     because the lab pod has no Azure CLI and registers with a PAT.
#   - TARGETARCH defaults to linux-x64 (Microsoft sets it in the Dockerfile).
#   - The token file lives next to the script in /azp (a writable emptyDir),
#     because this ConfigMap is mounted read-only.
#   - Otherwise unchanged: the token is never echoed, it is written to a 0600
#     file and AZP_TOKEN is unset before the agent runs, VSO_AGENT_IGNORE hides
#     the token variables from jobs, and a trap removes the agent on exit.
#   - Command substitutions quoted and [ -o ] split, to pass shellcheck.
apiVersion: v1
kind: ConfigMap
metadata:
  name: azdo-agent-start
  namespace: azdo-agents
  labels:
    app.kubernetes.io/name: azdo-agent
data:
  start.sh: |
    #!/bin/bash
    set -e

    TARGETARCH="${TARGETARCH:-linux-x64}"

    # Load the token from AZP_TOKEN or AZP_TOKEN_FILE. The token goes into a
    # 0600 file and AZP_TOKEN is unset, so job processes never inherit it.
    load_azp_token() {
      if [ -z "${AZP_TOKEN_FILE}" ]; then
        if [ -z "${AZP_TOKEN}" ]; then
          echo 1>&2 "error: missing AZP_TOKEN environment variable"
          exit 1
        fi

        AZP_TOKEN_FILE="$(dirname "$0")/.token"
      fi

      if [ -n "${AZP_TOKEN-}" ]; then
        if [ -d "${AZP_TOKEN_FILE}" ]; then
          echo 1>&2 "error: AZP_TOKEN_FILE is a directory, expected a file path: ${AZP_TOKEN_FILE}"
          exit 1
        fi
        if [ -e "${AZP_TOKEN_FILE}" ]; then
          if [ ! -w "${AZP_TOKEN_FILE}" ]; then
            echo 1>&2 "error: existing AZP_TOKEN_FILE is not writable: ${AZP_TOKEN_FILE}"
            exit 1
          fi
        else
          if [ ! -w "$(dirname "${AZP_TOKEN_FILE}")" ]; then
            echo 1>&2 "error: AZP_TOKEN_FILE parent directory is missing or not writable: $(dirname "${AZP_TOKEN_FILE}")"
            exit 1
          fi
        fi
        (umask 177 && echo -n "${AZP_TOKEN}" > "${AZP_TOKEN_FILE}")
        chmod 600 "${AZP_TOKEN_FILE}" || true
      else
        if [ ! -r "${AZP_TOKEN_FILE}" ]; then
          echo 1>&2 "error: AZP_TOKEN_FILE is not readable: ${AZP_TOKEN_FILE}"
          exit 1
        fi
        if [ ! -s "${AZP_TOKEN_FILE}" ]; then
          echo 1>&2 "error: AZP_TOKEN_FILE is empty: ${AZP_TOKEN_FILE}"
          exit 1
        fi
      fi

      # From here on the token is only in the file.
      unset AZP_TOKEN
    }

    # Remove the agent registration from the pool when the pod stops.
    cleanup() {
      trap "" EXIT

      if [ -e ./config.sh ]; then
        print_header "Cleanup. Removing Azure Pipelines agent..."

        # A running job makes removal fail, so retry for a while.
        max_attempts=10
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          ./config.sh remove --unattended --auth "PAT" --token "$(cat "${AZP_TOKEN_FILE}")" && break

          echo "Attempt $attempt failed. Retrying in 30 seconds..."
          attempt=$((attempt+1))
          sleep 30
        done
        if [ $attempt -gt $max_attempts ]; then
          echo 1>&2 "warning: failed to remove agent configuration after $max_attempts attempts"
        fi
      fi
    }

    print_header() {
      lightcyan="\033[1;36m"
      nocolor="\033[0m"
      echo -e "\n${lightcyan}$1${nocolor}\n"
    }

    if [ -z "${AZP_URL}" ]; then
      echo 1>&2 "error: missing AZP_URL environment variable"
      exit 1
    fi

    load_azp_token

    if [ -n "${AZP_WORK}" ]; then
      mkdir -p "${AZP_WORK}"
    fi

    # Tell the agent not to pass the token variables to jobs.
    export VSO_AGENT_IGNORE="AZP_TOKEN,AZP_TOKEN_FILE"

    print_header "1. Determining matching Azure Pipelines agent..."

    AZP_AGENT_PACKAGES=$(curl -LsS \
        -u "user:$(cat "${AZP_TOKEN_FILE}")" \
        -H "Accept:application/json" \
        "${AZP_URL}/_apis/distributedtask/packages/agent?platform=${TARGETARCH}&top=1")

    AZP_AGENT_PACKAGE_LATEST_URL=$(echo "${AZP_AGENT_PACKAGES}" | jq -r ".value[0].downloadUrl")

    if [ -z "${AZP_AGENT_PACKAGE_LATEST_URL}" ] || [ "${AZP_AGENT_PACKAGE_LATEST_URL}" == "null" ]; then
      echo 1>&2 "error: could not determine a matching Azure Pipelines agent"
      echo 1>&2 "check that account \"${AZP_URL}\" is correct and the token is valid for that account"
      exit 1
    fi

    print_header "2. Downloading and extracting Azure Pipelines agent..."

    curl -LsS "${AZP_AGENT_PACKAGE_LATEST_URL}" | tar -xz & wait $!

    # shellcheck disable=SC1091 # env.sh comes with the agent package
    . ./env.sh

    trap "cleanup; exit 0" EXIT
    trap "cleanup; exit 130" INT
    trap "cleanup; exit 143" TERM

    print_header "3. Configuring Azure Pipelines agent..."

    ./config.sh --unattended \
      --agent "${AZP_AGENT_NAME:-$(hostname)}" \
      --url "${AZP_URL}" \
      --auth "PAT" \
      --token "$(cat "${AZP_TOKEN_FILE}")" \
      --pool "${AZP_POOL:-Default}" \
      --work "${AZP_WORK:-_work}" \
      --replace \
      --acceptTeeEula & wait $!

    print_header "4. Running Azure Pipelines agent..."

    chmod +x ./run.sh

    # Run in the background and wait, so TERM and INT reach the traps above.
    ./run.sh "$@" & wait $!
