# Main branch pipeline: plan, environment approval, apply.
#
# Before the first run:
#   - Turn Auto apply off on the workspace, or TFE applies before the approval.
#   - Create the environment below with an Approvals check and a Branch control
#     check that allows only refs/heads/main.
#   - Variable group tfc-plan holds TF_API_TOKEN with plan permission; variable
#     group tfc-apply holds TF_API_TOKEN with apply permission and has the same
#     Branch control check, an approval and pipeline permission for this
#     pipeline only.
#
# Replace the placeholder values below.
trigger:
  branches:
    include:
      - main
pr: none

resources:
  repositories:
    - repository: tfc
      type: git
      name: <Project>/tfc-workflow-azdo
      ref: refs/tags/v2.0.0

extends:
  template: templates/pipelines/apply-run.yml@tfc
  parameters:
    workspace: my-app-dev
    organization: my-org
    hostname: tfe.example.internal
    pool:
      name: tfe-agents
    mode: docker
    # Absolute path on the agent to the TFE CA PEM file, or '' for a public CA.
    caBundle: ''
    environment: my-app-dev
