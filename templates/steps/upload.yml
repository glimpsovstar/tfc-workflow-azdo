# Upload a directory as a new configuration version: `tfci upload --json`.
#
# Output variable (step name = the `name` parameter, default "upload"):
#   CONFIGURATION_VERSION_ID   e.g. cv-abc123
# Same job:        $(upload.CONFIGURATION_VERSION_ID)
# Another job:     dependencies.<job>.outputs['upload.CONFIGURATION_VERSION_ID']
# Another stage:   stageDependencies.<stage>.<job>.outputs['upload.CONFIGURATION_VERSION_ID']
# The step fails when tfci fails or returns no configuration version ID.
#
# directory is relative to workingDirectory. workspace and directory are passed
# as single arguments (textArgs), so they may contain spaces.
parameters:
  - name: name
    type: string
    default: upload
  - name: displayName
    type: string
    default: Upload configuration
  - name: workspace
    type: string
  - name: directory
    type: string
    default: ./
  - name: speculative
    type: boolean
    default: false
  # Connection parameters, passed through to tfci.yml unchanged. Same
  # defaults as tfci.yml.
  - name: mode
    type: string
    default: docker
    values:
      - docker
      - native
  - name: image
    type: string
    default: hashicorp/tfci:v1.4.0
  - name: hostname
    type: string
    default: app.terraform.io
  - name: organization
    type: string
  - name: caBundle
    type: string
    default: ''
  - name: workingDirectory
    type: string
    default: $(System.DefaultWorkingDirectory)
  - name: tokenVariable
    type: string
    default: TF_API_TOKEN
  - name: maxTimeout
    type: string
    default: 1h

steps:
  - template: tfci.yml
    parameters:
      name: ${{ parameters.name }}_tfci
      displayName: ${{ parameters.displayName }}
      command: upload
      args: --speculative=${{ parameters.speculative }}
      textArgs:
        workspace: ${{ parameters.workspace }}
        directory: ${{ parameters.directory }}
      outputFile: $(Agent.TempDirectory)/tfci-${{ parameters.name }}.json
      mode: ${{ parameters.mode }}
      image: ${{ parameters.image }}
      hostname: ${{ parameters.hostname }}
      organization: ${{ parameters.organization }}
      caBundle: ${{ parameters.caBundle }}
      workingDirectory: ${{ parameters.workingDirectory }}
      tokenVariable: ${{ parameters.tokenVariable }}
      maxTimeout: ${{ parameters.maxTimeout }}

  - bash: |
      set -euo pipefail
      cv="$(jq -r '.configuration_version_id // empty' "$TFCI_OUT")"
      if [[ ! "$cv" =~ ^cv-[A-Za-z0-9]+$ ]]; then
        echo "##vso[task.logissue type=error]upload: no valid configuration_version_id in $TFCI_OUT (got '$cv')"
        exit 1
      fi
      echo "configuration version: $cv"
      echo "##vso[task.setvariable variable=CONFIGURATION_VERSION_ID;isOutput=true]$cv"
    name: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }} (outputs)
    env:
      TFCI_OUT: $(Agent.TempDirectory)/tfci-${{ parameters.name }}.json
