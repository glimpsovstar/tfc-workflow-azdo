# Post the Terraform plan summary to the pull request as one thread, and set a
# PR status, through the Azure DevOps REST API with System.AccessToken.
#
# Runs only for PR builds (Build.Reason == PullRequest). On a re-run for the
# same PR it updates its own thread, found by a hidden marker line
# `<!-- tfc-workflow-azdo:<workspace> -->`, instead of adding a new one.
#
# Every pipeline value reaches the script through env: only. No $(...) macro
# is expanded inside the script body.
#
# The build service identity needs "Contribute to pull requests" on the repo.
#
# API reference (REST API 7.1):
#   Threads, List:    https://learn.microsoft.com/en-us/rest/api/azure/devops/git/pull-request-threads/list?view=azure-devops-rest-7.1
#   Threads, Create:  https://learn.microsoft.com/en-us/rest/api/azure/devops/git/pull-request-threads/create?view=azure-devops-rest-7.1
#   Comments, Update: https://learn.microsoft.com/en-us/rest/api/azure/devops/git/pull-request-thread-comments/update?view=azure-devops-rest-7.1
#   Statuses, Create: https://learn.microsoft.com/en-us/rest/api/azure/devops/git/pull-request-statuses/create?view=azure-devops-rest-7.1
# Create thread body follows the "Comment on the pull request" sample there:
# commentType 1 (text), status 1 (active).

parameters:
  - name: summaryFile
    type: string
    default: $(Agent.TempDirectory)/plan-summary.md
  - name: workspace
    type: string
  - name: runLink
    type: string
    default: ''
  - name: runStatus
    type: string
    default: ''
  # Optional plan counts, for the PR status description (plan-output.yml outputs).
  - name: add
    type: string
    default: ''
  - name: change
    type: string
    default: ''
  - name: destroy
    type: string
    default: ''
  - name: statusContextGenre
    type: string
    default: terraform
  - name: statusContextName
    type: string
    default: tfe-plan
  - name: condition
    type: string
    default: succeededOrFailed()
  - name: displayName
    type: string
    default: Post plan to pull request

steps:
  - bash: |
      set -euo pipefail

      api_version="7.1"
      ok_states=" planned planned_and_finished cost_estimated policy_checked policy_override "

      # A runtime macro that did not resolve arrives as its own text: treat it as empty.
      unresolved() { [[ "$1" == "\$("* ]]; }
      if unresolved "$RUN_STATUS"; then RUN_STATUS=""; fi
      if unresolved "$RUN_LINK"; then RUN_LINK=""; fi
      for v in PLAN_ADD PLAN_CHANGE PLAN_DESTROY; do
        if unresolved "${!v}"; then printf -v "$v" '%s' ""; fi
      done
      status_text="${RUN_STATUS:-unknown}"

      for v in SYSTEM_ACCESSTOKEN COLLECTION_URI PROJECT REPO_ID PR_ID WORKSPACE; do
        if [[ -z "${!v:-}" ]]; then
          echo "##vso[task.logissue type=error]pr-comment: $v is empty"
          exit 1
        fi
      done
      if [[ ! "$PR_ID" =~ ^[0-9]+$ ]]; then
        echo "##vso[task.logissue type=error]pr-comment: pull request ID is not a number"
        exit 1
      fi

      uri_encode() { jq -rn --arg v "$1" '$v | @uri'; }
      base="${COLLECTION_URI%/}/$(uri_encode "$PROJECT")/_apis/git/repositories/$(uri_encode "$REPO_ID")/pullRequests/$PR_ID"

      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      resp="$tmp/response.json"

      # api METHOD URL [BODY_FILE]: response body goes to $resp.
      # The token goes to curl through a header file, not argv, and is never printed.
      api() {
        local method="$1" url="$2" body="${3:-}" code rc=0
        local args=(--fail-with-body -sS -X "$method" -o "$resp" -w '%{http_code}' -H 'Accept: application/json')
        if [[ -n "$body" ]]; then
          args+=(-H 'Content-Type: application/json' --data-binary "@$body")
        fi
        code="$(curl "${args[@]}" -H @<(printf 'Authorization: Bearer %s\n' "$SYSTEM_ACCESSTOKEN") "$url" 2>"$tmp/curl.err")" || rc=$?
        if [[ "$code" == 401 || "$code" == 403 ]]; then
          echo "##vso[task.logissue type=error]Azure DevOps returned HTTP $code for $method ${url%%\?*}. The build service identity needs 'Contribute to pull requests' on this repository (Project settings, Repositories, Security)."
          exit 1
        fi
        if [[ $rc -ne 0 ]]; then
          echo "##vso[task.logissue type=error]Azure DevOps API call failed: $method ${url%%\?*} (HTTP ${code:-none}, curl exit $rc)"
          cat "$tmp/curl.err" >&2
          if [[ -s "$resp" ]]; then head -c 1000 "$resp" >&2; echo >&2; fi
          exit 1
        fi
      }

      # Comment body: marker, then the summary, or a fallback line.
      marker="<!-- tfc-workflow-azdo:${WORKSPACE} -->"
      if [[ -s "$SUMMARY_FILE" ]]; then
        summary="$(cat "$SUMMARY_FILE")"
      else
        echo "##vso[task.logissue type=warning]Plan summary $SUMMARY_FILE not found: posting the run status only"
        summary="**Terraform plan for \`${WORKSPACE}\`:** plan output not available."
        summary+=$'\n\n'"Run status: \`${status_text}\`"
        if [[ -n "$RUN_LINK" ]]; then summary+=$'\n\n'"Run: ${RUN_LINK}"; fi
      fi
      content="${marker}"$'\n'"${summary}"

      # Find our own thread: the first comment of a live thread carries the marker.
      api GET "$base/threads?api-version=$api_version"
      found="$(jq -r --arg m "$marker" '
        [ (.value // [])[]
          | select((.isDeleted // false) | not)
          | select((.comments // []) | length > 0)
          | { tid: .id, c: (.comments | sort_by(.id) | .[0]) }
          | select((.c.isDeleted // false) | not)
          | select((.c.content // "") | contains($m)) ]
        | first // empty
        | "\(.tid) \(.c.id)"' "$resp")"

      if [[ -n "$found" ]]; then
        read -r thread_id comment_id <<<"$found"
        jq -n --arg content "$content" '{content: $content}' >"$tmp/body.json"
        api PATCH "$base/threads/$thread_id/comments/$comment_id?api-version=$api_version" "$tmp/body.json"
        echo "Updated PR thread $thread_id"
      else
        jq -n --arg content "$content" \
          '{comments: [{parentCommentId: 0, content: $content, commentType: 1}], status: 1}' >"$tmp/body.json"
        api POST "$base/threads?api-version=$api_version" "$tmp/body.json"
        echo "Created PR thread $(jq -r '.id // "?"' "$resp")"
      fi

      # PR status.
      if [[ "$ok_states" == *" ${RUN_STATUS} "* && -n "$RUN_STATUS" ]]; then
        state="succeeded"
      else
        state="failed"
      fi
      if [[ -n "$PLAN_ADD" && -n "$PLAN_CHANGE" && -n "$PLAN_DESTROY" ]]; then
        description="Plan: +${PLAN_ADD} ~${PLAN_CHANGE} -${PLAN_DESTROY} (${status_text})"
      else
        description="Terraform run ${status_text}"
      fi
      jq -n \
        --arg state "$state" \
        --arg description "$description" \
        --arg genre "$STATUS_GENRE" \
        --arg name "$STATUS_NAME" \
        --arg targetUrl "$RUN_LINK" \
        '{state: $state, description: $description, context: {genre: $genre, name: $name}}
         + (if $targetUrl == "" then {} else {targetUrl: $targetUrl} end)' >"$tmp/status.json"
      api POST "$base/statuses?api-version=$api_version" "$tmp/status.json"
      echo "Set PR status ${STATUS_GENRE}/${STATUS_NAME}: $state"
    displayName: ${{ parameters.displayName }}
    condition: and(${{ parameters.condition }}, eq(variables['Build.Reason'], 'PullRequest'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      COLLECTION_URI: $(System.CollectionUri)
      PROJECT: $(System.TeamProject)
      REPO_ID: $(Build.Repository.ID)
      PR_ID: $(System.PullRequest.PullRequestId)
      SUMMARY_FILE: ${{ parameters.summaryFile }}
      WORKSPACE: ${{ parameters.workspace }}
      RUN_LINK: ${{ parameters.runLink }}
      RUN_STATUS: ${{ parameters.runStatus }}
      PLAN_ADD: ${{ parameters.add }}
      PLAN_CHANGE: ${{ parameters.change }}
      PLAN_DESTROY: ${{ parameters.destroy }}
      STATUS_GENRE: ${{ parameters.statusContextGenre }}
      STATUS_NAME: ${{ parameters.statusContextName }}
