# Extends template for pull request validation builds: a speculative
# (plan-only) run on this PR's own code, posted back to the PR.
#
# One stage, two jobs:
#   validate (optional, no variable group: it runs untrusted PR code), then
#   plan: checkout, upload (speculative), run-create (plan only, on that
#   configuration version), plan-output, plan-log (optional, on by default),
#   pr-comment.
#
# Plan text: off by default on PRs. With showPlanLog true, plan-log.yml prints
# the Terraform plan in the job log and pr-comment.yml adds a trimmed copy to
# the PR thread, collapsed. The plan shows every value not marked sensitive to
# anyone who can read the log or the PR, and a PR author controls the code that
# is planned, so they could print a secret workspace variable through an
# output (docs/security.md). Turn it on only when PR authors are trusted and
# the workspace holds no secrets they should not see.
#
# The run is pinned to the configuration version this build uploaded
# ($(upload.CONFIGURATION_VERSION_ID)), so two PRs at once each see their own
# plan (Review Focus 3).
#
# A failed plan still reports: the run-create output step and pr-comment run on
# succeededOrFailed(), so the PR gets the comment and a failed status, then the
# job fails. plan-output runs whenever the run produced a plan ID (for example
# a plan that finished but failed a hard-mandatory policy), so the comment still
# carries the add, change and destroy counts.
#
# Azure Repos runs this for a PR through branch policy build validation, not
# through a YAML `pr:` trigger. See examples/azure-pipelines.pr.yml.
#
# Secrets: the job uses the variable group `variableGroup` (default tfc-plan).
# It must hold the variable named by `tokenVariable` (default TF_API_TOKEN), a
# TFE team token with plan permission only. The build service identity needs
# "Contribute to pull requests" on the repository for the PR comment.
#
# Job timeouts: every job sets timeoutInMinutes from jobTimeoutInMinutes
# (default 90). Keep it above maxTimeout (default 1h), or Azure DevOps cancels
# the job while tfci still waits for the run.
#
# Step templates are referenced by relative path (../steps/...), which resolves
# from this file inside the template repository when consumed with @alias.
# To confirm in the first server-side compile.
parameters:
  - name: workspace
    type: string
  - name: organization
    type: string
  # Required: the token only ever goes to the host named here.
  - name: hostname
    type: string
  # Terraform configuration directory, relative to the repository root.
  - name: directory
    type: string
    default: ./
  # Agent pool for the job, e.g. {name: tfe-agents} or {vmImage: ubuntu-24.04}.
  - name: pool
    type: object
  - name: mode
    type: string
    default: docker
    values:
      - docker
      - native
  - name: image
    type: string
    default: hashicorp/tfci:v1.4.0
  # Absolute path on the agent to a PEM file with the private CA for TFE.
  - name: caBundle
    type: string
    default: ''
  - name: variableGroup
    type: string
    default: tfc-plan
  - name: tokenVariable
    type: string
    default: TF_API_TOKEN
  - name: maxTimeout
    type: string
    default: 1h
  # Minutes before Azure DevOps cancels a job. Must exceed maxTimeout.
  - name: jobTimeoutInMinutes
    type: number
    default: 90
  # tfci TF_LOG: '', ERROR, WARN, INFO or DEBUG. Keep DEBUG out of shared logs as a precaution.
  - name: logLevel
    type: string
    default: ''
  - name: enableValidate
    type: boolean
    default: true
  # Print the Terraform plan text in the log and add it to the PR comment.
  # Off by default: a PR author could print workspace secrets through it
  # (docs/security.md).
  - name: showPlanLog
    type: boolean
    default: false
  - name: enableTflint
    type: boolean
    default: true
  # Validate step images and settings (see templates/steps/validate.yml).
  - name: terraformImage
    type: string
    default: hashicorp/terraform:1.17.0
  - name: tflintImage
    type: string
    default: ghcr.io/terraform-linters/tflint:v0.66.0
  # CLI config with a provider mirror, for `terraform init` without internet.
  - name: cliConfigFile
    type: string
    default: ''
  # CA bundle for `terraform init` against a private mirror. It replaces the
  # system roots there, unlike caBundle for tfci, so it is a separate value.
  - name: validateCaBundle
    type: string
    default: ''

stages:
  - stage: Plan
    displayName: Speculative plan
    jobs:
      # Validate runs PR code locally (terraform init downloads providers,
      # tflint may download plugins), so it is a separate job with NO variable
      # group: no secret exists in the job that executes untrusted PR code.
      - ${{ if eq(parameters.enableValidate, true) }}:
          - job: validate
            displayName: Validate (${{ parameters.workspace }})
            pool: ${{ parameters.pool }}
            timeoutInMinutes: ${{ parameters.jobTimeoutInMinutes }}
            steps:
              - checkout: self
              - template: ../steps/validate.yml
                parameters:
                  directory: $(System.DefaultWorkingDirectory)/${{ parameters.directory }}
                  mode: ${{ parameters.mode }}
                  terraformImage: ${{ parameters.terraformImage }}
                  tflintImage: ${{ parameters.tflintImage }}
                  enableTflint: ${{ parameters.enableTflint }}
                  tflintPluginInit: false  # always: PR code is untrusted, so tflint never uses the PR's .tflint.hcl
                  caBundle: ${{ parameters.validateCaBundle }}
                  cliConfigFile: ${{ parameters.cliConfigFile }}

      - job: plan
        displayName: Speculative plan (${{ parameters.workspace }})
        pool: ${{ parameters.pool }}
        timeoutInMinutes: ${{ parameters.jobTimeoutInMinutes }}
        ${{ if eq(parameters.enableValidate, true) }}:
          dependsOn: validate
        variables:
          - group: ${{ parameters.variableGroup }}
        steps:
          - checkout: self

          - template: ../steps/upload.yml
            parameters:
              workspace: ${{ parameters.workspace }}
              directory: ${{ parameters.directory }}
              speculative: true
              mode: ${{ parameters.mode }}
              image: ${{ parameters.image }}
              hostname: ${{ parameters.hostname }}
              organization: ${{ parameters.organization }}
              caBundle: ${{ parameters.caBundle }}
              tokenVariable: ${{ parameters.tokenVariable }}
              maxTimeout: ${{ parameters.maxTimeout }}
              logLevel: ${{ parameters.logLevel }}

          - template: ../steps/run-create.yml
            parameters:
              workspace: ${{ parameters.workspace }}
              configurationVersionId: $(upload.CONFIGURATION_VERSION_ID)
              planOnly: true
              mode: ${{ parameters.mode }}
              image: ${{ parameters.image }}
              hostname: ${{ parameters.hostname }}
              organization: ${{ parameters.organization }}
              caBundle: ${{ parameters.caBundle }}
              tokenVariable: ${{ parameters.tokenVariable }}
              maxTimeout: ${{ parameters.maxTimeout }}
              logLevel: ${{ parameters.logLevel }}

          - template: ../steps/plan-output.yml
            parameters:
              condition: and(succeededOrFailed(), ne(variables['run.PLAN_ID'], ''))
              planId: $(run.PLAN_ID)
              workspace: ${{ parameters.workspace }}
              runLink: $(run.RUN_LINK)
              runStatus: $(run.RUN_STATUS)
              configurationVersionId: $(upload.CONFIGURATION_VERSION_ID)
              mode: ${{ parameters.mode }}
              image: ${{ parameters.image }}
              hostname: ${{ parameters.hostname }}
              organization: ${{ parameters.organization }}
              caBundle: ${{ parameters.caBundle }}
              tokenVariable: ${{ parameters.tokenVariable }}
              maxTimeout: ${{ parameters.maxTimeout }}
              logLevel: ${{ parameters.logLevel }}

          - ${{ if eq(parameters.showPlanLog, true) }}:
              - template: ../steps/plan-log.yml
                parameters:
                  condition: and(succeededOrFailed(), ne(variables['run.PLAN_ID'], ''))
                  planId: $(run.PLAN_ID)
                  hostname: ${{ parameters.hostname }}
                  caBundle: ${{ parameters.caBundle }}
                  tokenVariable: ${{ parameters.tokenVariable }}

          # Default condition succeededOrFailed(): posts after a failed plan too.
          - template: ../steps/pr-comment.yml
            parameters:
              workspace: ${{ parameters.workspace }}
              runLink: $(run.RUN_LINK)
              runStatus: $(run.RUN_STATUS)
              add: $(plan_output.ADD)
              change: $(plan_output.CHANGE)
              destroy: $(plan_output.DESTROY)
              includePlanLog: ${{ parameters.showPlanLog }}
